# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      python-production:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      python-development:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Home Assistant and its test harness are bumped together by hand: the
      # pin tracks the ``homeassistant`` key in hacs.json, and each
      # pytest-homeassistant-custom-component release pins one exact Home
      # Assistant along with pytest, pytest-asyncio and pytest-cov.
      - dependency-name: "homeassistant"
      - dependency-name: "pytest-homeassistant-custom-component"
      # infrared-protocols belongs to Home Assistant's own infrared component,
      # which pins it exactly. Home Assistant installs that pin at runtime, so
      # this one has to move with the pinned Home Assistant version rather than
      # with its own releases.
      - dependency-name: "infrared-protocols"
